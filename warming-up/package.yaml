name:               warming-up
version:            0.1.0.0
license:            MIT
author:             Nobuo Yamashita
maintainer:         nobsun@gmail.com
copyright:          2026 Nobuo Yamashita

extra-source-files:
- README.md
- ChangeLog.md

description:         Please see the README

dependencies:
- base >= 4.7 && < 5
- adjunctions
- array
- attoparsec
- bifunctors
- binary
- bitvec
- bytestring
- comonad
- containers
- contravariant
- deepseq
- directory
- distributive
- exceptions
- extra
- fgl
- filepath
- flow
- free
- ghc-bignum
- ghc-boot-th
- ghc-prim
- hashable
- heaps
- hmatrix
- hmatrix-gsl
- hmatrix-special
- indexed-traversable
- indexed-traversable-instances
- integer-gmp
- integer-logarithms
- kan-extensions
- lens
- linear-base
- list-t
- massiv
- megaparsec
- monad-memo
- mono-traversable
- mtl
- mutable-containers
- mwc-random
- parallel
- parsec
- parser-combinators
- pretty
- primitive
- process
- profunctors
- psqueues
- random
- reflection
- regex-tdfa
- safe-exceptions
- scientific
- semialign
- semigroupoids
- split
- stm
- strict
- strict-lens
- tagged
- template-haskell
- text
- tf-random
- these
- these-lens
- time
- transformers
- trifecta
- unboxing-vector
- unix
- unordered-containers
- utility-ht
- vector
- vector-algorithms
- vector-split
- vector-stream
- vector-th-unbox
- wide-word
- witherable
- xhtml

language: GHC2021

default-extensions:
- CPP
- ImplicitParams
- LambdaCase
- LexicalNegation
- NPlusKPatterns
- OverloadedStrings
- DataKinds
- NoStarIsType
- TypeFamilyDependencies
- UndecidableInstances

ghc-options:
- -Wall

library:
    source-dirs: []

executables:
  add-entry:
    main:               Main.hs
    source-dirs:        app
    dependencies:
    - warming-up
